name: CI/CD Pipeline - CadastroDeNinjas

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cadastro_ninjas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e executar testes
        run: mvn -B clean verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/cadastro_ninjas
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Guardar artefato JAR
        run: cp target/CadastroDeNinjas-0.0.1-SNAPSHOT.jar target/app.jar

      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar

  deploy-to-ec2:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Enviar JAR para o EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/app.jar"
          target: "/home/ubuntu/app"
          strip_components: 1

      - name: Reiniciar a aplicação
        uses: appleboy/ssh-action@v0.1.10
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PASSWORD
          script: |
            if ! command -v java &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y openjdk-21-jre-headless
            fi

            # Para a versão anterior (o [a] evita casar com este próprio script)
            pkill -f '[a]pp\.jar' || true
            sleep 3
            pkill -9 -f '[a]pp\.jar' || true

            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app

            export SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/cadastro_ninjas
            export SPRING_DATASOURCE_USERNAME=postgres
            export SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD"

            nohup java -Xms128m -Xmx256m -jar app.jar > app.log 2>&1 </dev/null &
            disown

            # Espera a API responder (até ~60s)
            for i in $(seq 1 30); do
              if curl -fs http://localhost:8080/ninjas/boasVindas > /dev/null; then
                echo "Aplicação iniciada no EC2 com sucesso!"
                exit 0
              fi
              sleep 2
            done

            echo "A aplicação não respondeu. Últimas linhas do log:"
            tail -50 app.log
            exit 1