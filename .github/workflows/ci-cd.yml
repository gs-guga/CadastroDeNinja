name: CI/CD Pipeline - CadastroDeNinjas

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Criar arquivo .env para os testes
        run: |
          echo "POSTGRES_USER=testuser" >> .env
          echo "POSTGRES_PASSWORD=testpassword" >> .env
          echo "POSTGRES_DB=ninjadb" >> .env

      - name: Compilar e Executar Testes
        run: mvn clean test

      - name: Gerar Pacote JAR
        run: mvn package -DskipTests

      - name: Guardar artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  deploy-to-ec2:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Baixar o artefato JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Enviar JAR para o servidor EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 1

      - name: Executar a Aplicação no EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Instalar o Java 21 na instância caso ainda não esteja instalado
            if ! command -v java &> /dev/null; then
              sudo apt update
              sudo apt install -y openjdk-21-jre-headless
            fi

            # Encerrar a versão anterior da aplicação se estiver rodando
            PID=$(pgrep -f 'CadastroDeNinja.*\.jar' || true)
            if [ -n "$PID" ]; then
              kill -9 $PID
            fi

            # Executar a nova versão da API em segundo plano na porta 8080
            cd /home/ubuntu/app
            nohup java -jar *.jar > app.log 2>&1 &