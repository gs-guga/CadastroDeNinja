name: CI/CD Pipeline - CadastroDeNinjas

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cadastro_ninjas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e executar testes
        run: mvn -B clean verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/cadastro_ninjas
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Guardar artefato JAR
        run: cp target/CadastroDeNinjas-0.0.1-SNAPSHOT.jar target/app.jar

      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar

  deploy-to-ec2:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Enviar JAR para o EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/app.jar"
          target: "/home/ubuntu/app"
          strip_components: 1

      - name: Reiniciar a aplicação
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Instalar o Java 21 se ainda não estiver instalado
            if ! command -v java &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y openjdk-21-jre-headless
            fi

            # Encerrar o processo anterior da aplicação caso esteja rodando
            PID=$(pgrep -f 'app.jar' || true)
            if [ -n "$PID" ]; then
              echo "Encerrando processo antigo (PID: $PID)..."
              kill -9 $PID
            fi

            # Iniciar a nova versão do JAR em segundo plano na porta 8080
            cd /home/ubuntu/app
            nohup java -jar app.jar > app.log 2>&1 &
            echo "Aplicação inicializada com sucesso!"            sudo systemctl is-active ninjas