<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Ninja</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
        .form-container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #f39c12; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        .voltar { margin-left: 10px; color: #555; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Editar Ninja</h2>

    <form th:action="@{/ninjas/ui/atualizar/{id}(id=${ninja.id})}" th:object="${ninja}" method="post">
        <div class="form-group">
            <label>Nome:</label>
            <input type="text" th:field="*{nome}" required />
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" th:field="*{email}" required />
        </div>
        <div class="form-group">
            <label>Idade:</label>
            <input type="number" th:field="*{idade}" required />
        </div>
        <div class="form-group">
            <label>Rank:</label>
            <input type="text" th:field="*{rank}" required />
        </div>
        <div class="form-group">
            <label>Missão:</label>
            <!-- Seleciona o ID da missão associada ao NinjaDTO -->
            <select th:field="*{missoes.id}">
                <!-- Opção padrão caso o ninja não tenha missão -->
                <option value="">-- Selecione uma Missão --</option>

                <!-- Percorre todas as missões vindas do Controller -->
                <option th:each="missao : ${missoes}"
                        th:value="${missao.id}"
                        th:text="${missao.nome} + ' (Rank ' + ${missao.rank} + ')'">
                    Resgatar o Gato (Rank D)
                </option>
            </select>
        </div>
        <button type="submit">Atualizar Ninja</button>
        <a th:href="@{/ninjas/ui/listar}" class="voltar">Cancelar</a>
    </form>
</div>

</body>
</html>
