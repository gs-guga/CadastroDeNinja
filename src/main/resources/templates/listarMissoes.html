<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Missões</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
        h1 { color: #333; }
        .btn { padding: 8px 12px; text-decoration: none; border-radius: 4px; color: white; display: inline-block; font-size: 14px; }
        .btn-add { background-color: #27ae60; margin-bottom: 15px; }
        .btn-edit { background-color: #f39c12; }
        .btn-delete { background-color: #e74c3c; }
        .btn-info { background-color: #2980b9; }
        .btn-nav { background-color: #34495e; margin-bottom: 15px; margin-right: 10px; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .acoes { display: flex; gap: 5px; }
    </style>
</head>
<body>

<h1> Gerenciamento de Missões</h1>

<!-- Navegação e Botão de Adicionar -->
<a th:href="@{/ninjas/ui/listar}" class="btn btn-nav"> Ir para Ninjas</a>
<a th:href="@{/missoes/ui/adicionar}" class="btn btn-add">+ Cadastrar Nova Missão</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nome da Missão</th>
        <th>Rank</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="missao : ${missoes}">
        <td th:text="${missao.id}"></td>
        <td th:text="${missao.nome}"></td>
        <td th:text="${missao.rank}"></td>
        <td class="acoes">
            <a th:href="@{/missoes/ui/listar/{id}(id=${missao.id})}" class="btn btn-info">Ver</a>
            <a th:href="@{/missoes/ui/editar/{id}(id=${missao.id})}" class="btn btn-edit">Editar</a>
            <a th:href="@{/missoes/ui/deletar/{id}(id=${missao.id})}"
               class="btn btn-delete"
               onclick="return confirm('Tem certeza que deseja deletar esta missão?')">Deletar</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
