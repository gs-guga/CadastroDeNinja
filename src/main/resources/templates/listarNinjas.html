<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Ninjas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
        h1 { color: #333; }
        .btn { padding: 8px 12px; text-decoration: none; border-radius: 4px; color: white; display: inline-block; font-size: 14px; }
        .btn-add { background-color: #27ae60; margin-bottom: 15px; }
        .btn-edit { background-color: #f39c12; }
        .btn-delete { background-color: #e74c3c; }
        .btn-info { background-color: #2980b9; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .acoes { display: flex; gap: 5px; }
    </style>
</head>
<body>

<h1> Lista de Ninjas</h1>

<!-- Botão para abrir a tela de adicionar ninja -->
<a th:href="@{/ninjas/ui/adicionar}" class="btn btn-add">+ Cadastrar Novo Ninja</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Email</th>
        <th>Idade</th>
        <th>Rank</th>
        <th>Missão</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ninja : ${ninjas}">
        <td th:text="${ninja.id}"></td>
        <td th:text="${ninja.nome}"></td>
        <td th:text="${ninja.email}"></td>
        <td th:text="${ninja.idade}"></td>
        <td th:text="${ninja.rank}"></td>
        <td>
            <span th:if="${ninja.missoes != null}" th:text="${ninja.missoes.nome}"></span>
            <span th:if="${ninja.missoes == null}">Sem missão</span>
        </td>
        <td class="acoes">
            <a th:href="@{/ninjas/ui/listar/{id}(id=${ninja.id})}" class="btn btn-info">Ver</a>
            <a th:href="@{/ninjas/ui/editar/{id}(id=${ninja.id})}" class="btn btn-edit">Editar</a>
            <a th:href="@{/ninjas/ui/deletar/{id}(id=${ninja.id})}"
               class="btn btn-delete"
               onclick="return confirm('Tem certeza que deseja deletar este ninja?')">Deletar</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
