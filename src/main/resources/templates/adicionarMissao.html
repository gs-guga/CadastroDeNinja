<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Missão</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
        .form-container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        .voltar { margin-left: 10px; color: #555; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Cadastrar Missão</h2>

    <form th:action="@{/missoes/ui/salvar}" th:object="${missao}" method="post">
        <div class="form-group">
            <label>Nome da Missão:</label>
            <input type="text" th:field="*{nome}" placeholder="Ex: Resgatar o Gato" required />
        </div>
        <div class="form-group">
            <label>Rank:</label>
            <select th:field="*{rank}" required>
                <option value="">-- Selecione o Rank --</option>
                <option value="D">Rank D</option>
                <option value="C">Rank C</option>
                <option value="B">Rank B</option>
                <option value="A">Rank A</option>
                <option value="S">Rank S</option>
            </select>
        </div>

        <button type="submit">Salvar Missão</button>
        <a th:href="@{/missoes/ui/listar}" class="voltar">Cancelar</a>
    </form>
</div>

</body>
</html>
