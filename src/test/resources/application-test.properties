spring.datasource.driverClassName=org.h2.Driver

# Configurações do Hibernate e desativação do Flyway
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.flyway.enabled=false

# Falsifica as variáveis do .env (O Spring vai injetar isso direto no banco!)
DB_URL=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
DB_USERNAME=sa
DB_PASSWORD=